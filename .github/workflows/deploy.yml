name: Deploy Caelum to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        working-directory: web
        run: npm ci
      - name: Build Pages artifact
        working-directory: web
        run: npm run build
      - name: Verify pages, assets, and data
        working-directory: web
        run: npm test
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Verify GitHub Pages source
        uses: actions/github-script@v7
        timeout-minutes: 1
        with:
          script: |
            const { data } = await github.rest.repos.getPages({
              ...context.repo,
              request: { timeout: 15000 },
            });
            if (data.build_type !== 'workflow') {
              throw new Error('Pages Source must be GitHub Actions. Change Settings → Pages → Build and deployment → Source, then rerun this workflow.');
            }
            core.info('Verified Pages Source: GitHub Actions.');
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@v4
