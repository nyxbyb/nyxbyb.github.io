="#746c5c" stroke-width="2.5" data-tea-wall="W16"/><line x1="301" y1="357" x2="367" y2="357" stroke="#71958d" stroke-width="1.5" /><line x1="70" y1="186.5" x2="70" y2="332.25" stroke="#71958d" stroke-width="1.5" /><line x1="94.75" y1="357" x2="292.75" y2="357" stroke="#71958d" stroke-width="1.5" /><path d="M168.45 332.25 L224 236 L279.55 332.25Z" fill="#bfc6ae" fill-opacity=".25" stroke="#7f916e" stroke-width="1.4"/><circle cx="224" cy="236" r="6" fill="#788d62"/><text x="224" y="222" font-size="10" fill="#6d8059" text-anchor="middle">主听位</text><circle cx="326.3" cy="205.20000000000005" r="5" fill="#b29752"/><text x="335.3" y="200.2" font-size="10" fill="#5e6052" >TL03</text><circle cx="96.95" cy="185.4" r="5" fill="#9a86a0"/><text x="105.95" y="180.4" font-size="10" fill="#5e6052" >TA01</text></g><text x="70" y="497" font-size="12" fill="#5e6052" >茶柜2.55×0.60×0.90m · 茶桌Ø1.20 / H0.68m · 柜前工作带1.20m</text><text x="680" y="163" font-size="13" fill="#697858" >A01 · 约60°试听起点</text><text x="680" y="183" font-size="11" fill="#8a8d77" >主听位(2.80,6.80)，两箱中心距2.02m、</text><text x="680" y="200" font-size="11" fill="#8a8d77" >左右听距约2.02m，夹角约60.0°。这是一组可试</text><text x="680" y="217" font-size="11" fill="#8a8d77" >听的约60°试摆；窗…</text><text x="680" y="343" font-size="13" fill="#697858" >SC01 · 香气可选，也可以没有</text><text x="680" y="363" font-size="11" fill="#8a8d77" >西段F-L08独立闭合香品格与F-L20可取出扩香盘</text><text x="680" y="380" font-size="11" fill="#8a8d77" >；与干茶和音响分开。只在独处场景按需短时使用，泡茶时</text><text x="680" y="397" font-size="11" fill="#8a8d77" >关闭收起，不设置明火…</text><text x="70" y="550" font-size="12" fill="#858a72" >柜上烧水，保温小壶送茶桌，坐下干泡。TR01的0.55m标人员局部站位间隔，不是器具全程；主通行借</text><text x="70" y="571" font-size="12" fill="#858a72" >回廊绕过茶湾。</text><text x="70" y="657" font-size="11" fill="#a09c89" >给排水、负荷、防护与声学仍待专业核验；香气可选，泡茶时关闭收起。</text></svg>