"16" fill="#beb59f" stroke="#9d947e" stroke-width=".9" /><rect x="891" y="225" width="96" height="200" fill="#dce5d7" stroke="#8b9d90" stroke-width=".9" /><text x="939" y="215" font-size="12" fill="#74876c" text-anchor="middle">D09</text><text x="939" y="451" font-size="10" fill="#8e8e78" text-anchor="middle">1.20m / 0.00–2.50m</text><rect x="591" y="225" width="288" height="188" fill="#dce5d7" stroke="#8b9d90" stroke-width=".9" /><text x="735" y="215" font-size="12" fill="#74876c" text-anchor="middle">V06</text><text x="735" y="451" font-size="10" fill="#8e8e78" text-anchor="middle">3.60m / 0.15–2.50m</text><line x1="555" y1="474" x2="1035" y2="474" stroke="#afa28b" stroke-width="0.8" /><text x="795" y="468" font-size="11" fill="#9b8b71" text-anchor="middle">W03 · 6.00 m</text><text x="80" y="527" font-size="12" fill="#768166" >窗头与檐口放大关系</text><rect x="115" y="589" width="36" height="30" fill="#c2b69d" stroke="#a08e70" stroke-width=".9" /><rect x="115" y="559" width="103.5" height="30" fill="#bdb39b" stroke="#998b70" stroke-width=".9" /><line x1="133" y1="649" x2="133" y2="619" stroke="#799c97" stroke-width="2" /><line x1="151" y1="626.5" x2="218.5" y2="626.5" stroke="#8e9c82" stroke-width="0.8" /><text x="300" y="560" font-size="12" fill="#5e6052" >墙厚0.24m · 窗门头2.50m</text><text x="300" y="583" font-size="12" fill="#5e6052" >檐底2.70m · 檐顶2.90m</text><text x="300" y="606" font-size="12" fill="#5e6052" >自外墙面挑出0.45m</text><text x="620" y="535" font-size="12" fill="#858b75" >V06与D09间0.15m实垛固定；窗台始终0.15m</text><text x="620" y="556" font-size="12" fill="#858b75" >，不在外观中抬成高窗台。视野不假设远山；屋檐受力、防水</text><text x="620" y="577" font-size="12" fill="#858b75" >、排水待深化。</text></svg>