="439.5" stroke="#746c5c" stroke-width="2.5" data-tea-wall="W16"/><line x1="301" y1="357" x2="367" y2="357" stroke="#71958d" stroke-width="1.5" /><line x1="70" y1="186.5" x2="70" y2="332.25" stroke="#71958d" stroke-width="1.5" /><line x1="94.75" y1="357" x2="292.75" y2="357" stroke="#71958d" stroke-width="1.5" /><circle data-tea-point="TL01" cx="532" cy="307.5" r="3.5" fill="#b29752"/><line x1="532" y1="307.5" x2="540" y2="324.5" stroke="#b29752" stroke-width="0.6" /><text x="542" y="327.5" font-size="9" fill="#b29752" >TL01</text><circle data-tea-point="TL02" cx="533.375" cy="178.8" r="3.5" fill="#b29752"/><line x1="533.375" y1="178.8" x2="521.375" y2="238.8" stroke="#b29752" stroke-width="0.6" /><text x="523.375" y="241.8" font-size="9" fill="#b29752" >TL02</text><circle data-tea-point="TL03" cx="326.3" cy="205.20000000000005" r="3.5" fill="#b29752"/><line x1="326.3" y1="205.2" x2="334.3" y2="222.2" stroke="#b29752" stroke-width="0.6" /><text x="336.3" y="225.2" font-size="9" fill="#b29752" >TL03</text><circle data-tea-point="TC01" cx="457.75" cy="170.55000000000004" r="3.5" fill="#ad7755"/><line x1="457.75" y1="170.55" x2="422.75" y2="204.55" stroke="#ad7755" stroke-width="0.6" /><text x="424.75" y="207.55" font-size="9" fill="#ad7755" >TC01</text><circle data-tea-point="TP01" cx="552.9" cy="170.55000000000004" r="3.5" fill="#ad7755"/><line x1="552.9" y1="170.55" x2="540.9" y2="212.55" stroke="#ad7755" stroke-width="0.6" /><text x="542.9" y="215.55" font-size="9" fill="#ad7755" >TP01</text><circle data-tea-point="TP02" cx="345" cy="170.55000000000004" r="3.5" fill="#ad7755"/><line x1="345" y1="170.55" x2="295" y2="190.55" stroke="#ad7755" stroke-width="0.6" /><text x="297" y="193.55" font-size="9" fill="#ad7755" >TP02</text><circle data-tea-point="TP03" cx="589.75" cy="170.55000000000004" r="3.5" fill="#ad7755"/><line x1="589.75" y1="170.55" x2="597.75" y2="190.55" stroke="#ad7755" stroke-width="0.6" /><text x="599.75" y="193.55" font-size="9" fill="#ad7755" >TP03</text><circle data-tea-point="TN01" cx="351.6" cy="170.55000000000004" r="3.5" fill="#7a8867"/><line x1="351.6" y1="170.55" x2="354.6" y2="190.55" stroke="#7a8867" stroke-width="0.6" /><text x="356.6" y="193.55" font-size="9" fill="#7a8867" >TN01</text><circle data-tea-point="TW01" cx="483.05" cy="182.10000000000002" r="3.5" fill="#6d9295"/><line x1="483.05" y1="182.1" x2="461.05" y2="226.1" stroke="#6d9295" stroke-width="0.6" /><text x="463.05" y="229.1" font-size="9" fill="#6d9295" >TW01</text><circle data-tea-point="TW02" cx="483.05" cy="182.10000000000002" r="3.5" fill="#6d9295"/><line x1="483.05" y1="182.1" x2="461.05" y2="243.1" stroke="#6d9295" stroke-width="0.6" /><text x="463.05" y="246.1" font-size="9" fill="#6d9295" >TW02</text><circle data-tea-point="TA01" cx="96.95" cy="185.4" r="3.5" fill="#9a86a0"/><line x1="96.95" y1="185.4" x2="104.95" y2="202.4" stroke="#9a86a0" stroke-width="0.6" /><text x="106.95" y="205.4" font-size="9" fill="#9a86a0" >TA01</text></g><text x="70" y="497" font-size="12" fill="#5e6052" >茶柜2.55×0.60×0.90m · 茶桌Ø1.20 / H0.68m · 柜前工作带1.20m</text><text x="680" y="163" font-size="13" fill="#697858" >TL01 · 茶席吊灯</text><text x="680" y="183" font-size="11" fill="#8a8d77" >灯位对准茶桌，不作为穿行区低垂障碍。</text><text x="680" y="206" font-size="13" fill="#697858" >TL02 · 茶柜工作灯</text><text x="680" y="226" font-size="11" fill="#8a8d77" >连续照亮水槽、沥水、烧水和托盘区。</text><text x="680" y="249" font-size="13" fill="#697858" >TL03 · 阅读落地灯</text><text x="680" y="269" font-size="11" fill="#8a8d77" >灯光停留在读书椅与唱片柜附近，不照向显示器或卧室…</text><text x="680" y="292" font-size="13" fill="#697858" >TC01 · 入口场景控制</text><text x="680" y="312" font-size="11" fill="#8a8d77" >从回廊入起居时可切换茶、听音、清洗和独处。</text><text x="680" y="335" font-size="13" fill="#697858" >TP01 · 烧水专用插座位</text><text x="680" y="355" font-size="11" fill="#8a8d77" >插座在烧水区后方，与西侧茶洗槽分开。</text><text x="680" y="378" font-size="13" fill="#697858" >TP02 · 音响低位电源</text><text x="680" y="398" font-size="11" fill="#8a8d77" >电源与信号在唱片柜后检修；不沿D09门槛铺活动线…</text><text x="680" y="421" font-size="13" fill="#697858" >TP03 · 茶柜备用电源</text><text x="680" y="441" font-size="11" fill="#8a8d77" >在洁净托盘一端预留，不放在水槽正上方。</text><text x="680" y="464" font-size="13" fill="#697858" >TN01 · 有线音频与网络</text><text x="680" y="484" font-size="11" fill="#8a8d77" >唱片、流媒体和未来设备可共用可检修信号位。</text><text x="680" y="507" font-size="13" fill="#697858" >TW01 · 茶洗给水位</text><text x="680" y="527" font-size="11" fill="#8a8d77" >给水在水槽柜内可检修。</text><text x="680" y="550" font-size="13" fill="#697858" >TW02 · 茶洗排水位</text><text x="680" y="570" font-size="11" fill="#8a8d77" >湿区沿北服务带向餐厨协调，不以图中折线代替真实排…</text><text x="680" y="593" font-size="13" fill="#697858" >TA01 · 独处香气位</text><text x="680" y="613" font-size="11" fill="#8a8d77" >西端独立香品格与可取出无明火扩香盘，远离干茶、烧…</text><text x="70" y="550" font-size="12" fill="#858a72" >柜上烧水，保温小壶送茶桌，坐下干泡。TR01的0.55m标人员局部站位间隔，不是器具全程；主通行借</text><text x="70" y="571" font-size="12" fill="#858a72" >回廊绕过茶湾。</text><text x="70" y="657" font-size="11" fill="#a09c89" >给排水、负荷、防护与声学仍待专业核验；香气可选，泡茶时关闭收起。</text></svg>