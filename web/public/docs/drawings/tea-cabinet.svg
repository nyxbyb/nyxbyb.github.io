<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" role="img" aria-label="迟庭 · 茶水柜深化立面" style="display:block;width:100%;height:auto;background:#f8f5ee;font-family:Georgia,'Songti SC','Noto Serif SC',serif"><title>迟庭 · 茶水柜深化立面</title><defs><marker id="route-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1L9 5L0 9" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><text x="70" y="44" font-size="16" fill="#5e6052" >迟庭  /  CHITING</text><text x="1010" y="44" font-size="11" fill="#858673" text-anchor="end">T-02 / REV.03</text><text x="70" y="78" font-size="22" fill="#5e6052" >茶水柜 · 洗、沏与归位</text><text x="70" y="103" font-size="11" fill="#959281" >向北看的柜体正立面；分格与台面器物直接读取同一模型。</text><rect x="85" y="242" width="612" height="216" fill="#d6c19d" stroke="#a6916e" stroke-width=".9" /><rect x="85" y="251.6" width="144" height="187.2" fill="#d6c19d" stroke="#a6916e" stroke-width=".9" /><text x="157" y="483" font-size="12" fill="#827256" text-anchor="middle">ST01</text><text x="157" y="504" font-size="11" fill="#827256" text-anchor="middle">水槽与检修</text><rect x="229" y="251.6" width="144" height="187.2" fill="#d6c19d" stroke="#a6916e" stroke-width=".9" /><line x1="229" y1="395.6" x2="373" y2="395.6" stroke="#ad9774" stroke-width="0.9" /><line x1="229" y1="338" x2="373" y2="338" stroke="#ad9774" stroke-width="0.9" /><line x1="229" y1="251.6" x2="373" y2="251.6" stroke="#ad9774" stroke-width="0.9" /><text x="301" y="483" font-size="12" fill="#827256" text-anchor="middle">ST02</text><text x="301" y="504" font-size="11" fill="#827256" text-anchor="middle">杯具抽屉</text><rect x="373" y="251.6" width="156" height="187.2" fill="#d6c19d" stroke="#a6916e" stroke-width=".9" /><line x1="373" y1="395.6" x2="529" y2="395.6" stroke="#ad9774" stroke-width="0.9" /><line x1="373" y1="338" x2="529" y2="338" stroke="#ad9774" stroke-width="0.9" /><line x1="373" y1="251.6" x2="529" y2="251.6" stroke="#ad9774" stroke-width="0.9" /><text x="451" y="483" font-size="12" fill="#827256" text-anchor="middle">ST03</text><text x="451" y="504" font-size="11" fill="#827256" text-anchor="middle">托盘与耐热耗材</text><rect x="529" y="251.6" width="168" height="187.2" fill="#d6c19d" stroke="#a6916e" stroke-width=".9" /><line x1="529" y1="342.8" x2="697" y2="342.8" stroke="#ad9774" stroke-width="0.9" /><line x1="529" y1="438.8" x2="529" y2="251.6" stroke="#829e92" stroke-width="3" /><text x="613" y="483" font-size="12" fill="#827256" text-anchor="middle">ST04</text><text x="613" y="504" font-size="11" fill="#827256" text-anchor="middle">洁净端干茶内盒</text><rect x="85" y="242" width="612" height="9.6" fill="#ece5d6" stroke="#b5a68c" stroke-width=".9" /><rect x="85" y="438.8" width="612" height="19.2" fill="#aa987b" stroke="none" stroke-width=".9" /><rect x="121" y="234.8" width="100.8" height="7.2" fill="#dce0d3" stroke="#879782" stroke-width=".9" /><text x="171.4" y="224.8" font-size="10" fill="#7d8c71" text-anchor="middle">F-L15</text><rect x="257.8" y="236" width="132" height="6" fill="#dce0d3" stroke="#879782" stroke-width=".9" /><text x="323.8" y="226" font-size="10" fill="#7d8c71" text-anchor="middle">F-L16</text><rect x="445" y="174.8" width="62.4" height="67.2" fill="#8e9588" stroke="#879782" stroke-width=".9" /><text x="476.2" y="164.8" font-size="10" fill="#7d8c71" text-anchor="middle">F-L17</text><rect x="557.8" y="236" width="108" height="6" fill="#dce0d3" stroke="#879782" stroke-width=".9" /><text x="611.8" y="226" font-size="10" fill="#7d8c71" text-anchor="middle">F-L18</text><circle cx="476.19999999999976" cy="182" r="5" fill="#f5f1e5" stroke="#ad7755"/><text x="486.2" y="186" font-size="10" fill="#ad7755" >TP01</text><circle cx="636.9999999999998" cy="182" r="5" fill="#f5f1e5" stroke="#ad7755"/><text x="647" y="186" font-size="10" fill="#ad7755" >TP03</text><circle cx="171.39999999999986" cy="326" r="5" fill="#f5f1e5" stroke="#6d9295"/><text x="181.4" y="330" font-size="10" fill="#6d9295" >TW01</text><circle cx="171.39999999999986" cy="374" r="5" fill="#f5f1e5" stroke="#6d9295"/><text x="181.4" y="378" font-size="10" fill="#6d9295" >TW02</text><line x1="85" y1="538" x2="697" y2="538" stroke="#b2a48b" stroke-width="0.8" /><text x="391" y="530" font-size="13" fill="#95846a" text-anchor="middle">2.55 m</text><text x="765" y="175" font-size="16" fill="#707c61" >真正操作柜，而非浅书架</text><text x="765" y="205" font-size="12" fill="#858b75" >柜深600mm，台高900mm。ST</text><text x="765" y="226" font-size="12" fill="#858b75" >01水槽检修，ST02杯具，ST03</text><text x="765" y="247" font-size="12" fill="#858b75" >壶下托盘耗材，ST04最东隔热密封干</text><text x="765" y="268" font-size="12" fill="#858b75" >茶。</text><text x="765" y="378" font-size="12" fill="#858b75" >干茶不放烧水壶下。实际茶盒、温湿度与</text><text x="765" y="399" font-size="12" fill="#858b75" >抽屉行程仍须试用和深化，不能据此直接</text><text x="765" y="420" font-size="12" fill="#858b75" >下单定制。</text><text x="85" y="615" font-size="12" fill="#8d8f7b" >香品在西端F-L08独立闭合格，与干茶、音响分开；泡茶前收起无明火扩香盘。</text></svg>