ll="#9b9f8c" stroke="#b5a181" stroke-width=".9" /></g><g data-tea-furniture="F-L18"><rect x="571.6" y="182.1" width="24.75" height="22" fill="#d4bd98" stroke="#b5a181" stroke-width=".9" /></g><g data-tea-furniture="F-L19"><rect x="320.25" y="199.15" width="12.1" height="12.1" fill="#d4bd98" stroke="#b5a181" stroke-width=".9" /></g><g data-tea-furniture="F-L20"><rect x="85.4" y="179.9" width="23.1" height="11" fill="#9b9f8c" stroke="#b5a181" stroke-width=".9" /></g><g data-tea-furniture="F-L21"><rect x="516.6" y="296.5" width="26.4" height="17.6" fill="#d4bd98" stroke="#b5a181" stroke-width=".9" /></g><g data-tea-furniture="F-L22"><rect x="545.2" y="288.8" width="8.8" height="8.8" fill="#d4bd98" stroke="#b5a181" stroke-width=".9" /></g><g data-tea-furniture="F-L23"><ellipse cx="514.95" cy="319.6" rx="4.95" ry="4.95" fill="#d4bd98" stroke="#b5a181"/></g><line x1="70" y1="170" x2="70" y2="186.5" stroke="#746c5c" stroke-width="4" data-tea-wall="W02"/><line x1="70" y1="332.25" x2="70" y2="357" stroke="#746c5c" stroke-width="4" data-tea-wall="W02"/><line x1="70" y1="357" x2="94.75" y2="357" stroke="#746c5c" stroke-width="4" data-tea-wall="W03"/><line x1="292.75" y1="357" x2="301" y2="357" stroke="#746c5c" stroke-width="4" data-tea-wall="W03"/><line x1="367" y1="357" x2="400" y2="357" stroke="#746c5c" stroke-width="4" data-tea-wall="W03"/><line x1="400" y1="357" x2="400" y2="439.5" stroke="#746c5c" stroke-width="4" data-tea-wall="W04"/><line x1="70" y1="170" x2="389" y2="170" stroke="#746c5c" stroke-width="2.5" data-tea-wall="W11"/><line x1="455" y1="170" x2="620" y2="170" stroke="#746c5c" stroke-width="2.5" data-tea-wall="W11"/><line x1="400" y1="439.5" x2="620" y2="439.5" stroke="#746c5c" stroke-width="2.5" data-tea-wall="W14"/><line x1="620" y1="170" x2="620" y2="197.5" stroke="#746c5c" stroke-width="2.5" data-tea-wall="W15"/><line x1="620" y1="280" x2="620" y2="439.5" stroke="#746c5c" stroke-width="2.5" data-tea-wall="W15"/><line x1="620" y1="439.5" x2="620" y2="439.5" stroke="#746c5c" stroke-width="2.5" data-tea-wall="W16"/><line x1="301" y1="357" x2="367" y2="357" stroke="#71958d" stroke-width="1.5" /><line x1="70" y1="186.5" x2="70" y2="332.25" stroke="#71958d" stroke-width="1.5" /><line x1="94.75" y1="357" x2="292.75" y2="357" stroke="#71958d" stroke-width="1.5" /><polyline data-tea-route="TR01" points="570.5,227.75000000000006 570.5,258" fill="none" stroke="#bb8854" stroke-width="2" marker-end="url(#route-arrow)"/><polyline data-tea-route="TR02" points="570.5,258 570.5,227.75000000000006 482.5,227.75000000000006" fill="none" stroke="#6e9895" stroke-width="2" marker-end="url(#route-arrow)"/><circle cx="483.05" cy="192.00000000000003" r="9" fill="#f8f5ee" stroke="#a88b5a"/><text x="483.05" y="195" font-size="9" fill="#94774c" text-anchor="middle">01</text><circle cx="517.9749999999999" cy="192.55000000000007" r="9" fill="#f8f5ee" stroke="#a88b5a"/><text x="517.975" y="195.55" font-size="9" fill="#94774c" text-anchor="middle">02</text><circle cx="552.9000000000001" cy="194.20000000000002" r="9" fill="#f8f5ee" stroke="#a88b5a"/><text x="552.9" y="197.2" font-size="9" fill="#94774c" text-anchor="middle">03</text><circle cx="583.9749999999999" cy="193.10000000000005" r="9" fill="#f8f5ee" stroke="#a88b5a"/><text x="583.975" y="196.1" font-size="9" fill="#94774c" text-anchor="middle">04</text><circle cx="532" cy="307.5" r="9" fill="#f8f5ee" stroke="#a88b5a"/><text x="532" y="310.5" font-size="9" fill="#94774c" text-anchor="middle">05</text></g><text x="70" y="497" font-size="12" fill="#5e6052" >茶柜2.55×0.60×0.90m · 茶桌Ø1.20 / H0.68m · 柜前工作带1.20m</text><text x="680" y="163" font-size="13" fill="#697858" >TS01 · 洗涤与弃水</text><text x="680" y="183" font-size="11" fill="#8a8d77" >独立茶洗槽接收茶水与杯具；洗笔另在画室，不借用食品或</text><text x="680" y="200" font-size="11" fill="#8a8d77" >茶水槽。</text><text x="680" y="241" font-size="13" fill="#697858" >TS02 · 沥水与擦干</text><text x="680" y="261" font-size="11" fill="#8a8d77" >洗后在水槽旁沥干，再擦干归柜；不把湿杯直接放入干茶抽</text><text x="680" y="278" font-size="11" fill="#8a8d77" >屉。</text><text x="680" y="319" font-size="13" fill="#697858" >TS03 · 定点烧水</text><text x="680" y="339" font-size="11" fill="#8a8d77" >电壶固定在耐热柜面，不端着通电或沸腾的电壶跨主路；具</text><text x="680" y="356" font-size="11" fill="#8a8d77" >体温度按所泡茶类决定。</text><text x="680" y="397" font-size="13" fill="#697858" >TS04 · 洁净续水与托盘</text><text x="680" y="417" font-size="11" fill="#8a8d77" >柜上烧水后装入小保温壶，加盖托盘送至茶桌；0.55m</text><text x="680" y="434" font-size="11" fill="#8a8d77" >只是人员局部服务站位间隔，不是器具全程。</text><text x="680" y="475" font-size="13" fill="#697858" >TS05 · 坐姿干泡茶席</text><text x="680" y="495" font-size="11" fill="#8a8d77" >直径1.2m、桌高0.68m三人茶席，配茶盘、壶承/</text><text x="680" y="512" font-size="11" fill="#8a8d77" >公道杯位置、小保温壶和废水盂；坐下冲泡与品饮，茶水柜</text><text x="680" y="529" font-size="11" fill="#8a8d77" >负责烧水和洗涤。</text><text x="70" y="550" font-size="12" fill="#858a72" >柜上烧水，保温小壶送茶桌，坐下干泡。TR01的0.55m标人员局部站位间隔，不是器具全程；主通行借</text><text x="70" y="571" font-size="12" fill="#858a72" >回廊绕过茶湾。</text><text x="70" y="657" font-size="11" fill="#a09c89" >给排水、负荷、防护与声学仍待专业核验；香气可选，泡茶时关闭收起。</text></svg>