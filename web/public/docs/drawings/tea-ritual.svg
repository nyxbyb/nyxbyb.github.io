<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" role="img" aria-label="茶室 · 坐下冲泡与归位" style="display:block;width:100%;height:auto;background:#f8f5ee;font-family:Georgia,'Songti SC','Noto Serif SC',serif"><title>茶室 · 坐下冲泡与归位</title><defs><marker id="route-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1L9 5L0 9" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><text x="70" y="44" font-size="16" fill="#5e6052" >迟庭  /  CHITING</text><text x="1010" y="44" font-size="11" fill="#858673" text-anchor="end">T-01 / RITUAL</text><text x="70" y="78" font-size="22" fill="#5e6052" >茶室 · 坐下冲泡与归位</text><text x="70" y="103" font-size="11" fill="#959281" >坐标与编号读取核心模型；点位是功能预留，不是施工电气或排水规格。</text><defs><clipPath id="tea-clip"><rect x="55" y="153" width="582" height="309"/></clipPath></defs><g clip-path="url(#tea-clip)"><path d="M70 170 L620 170 L620 357 L70 357Z" fill="#eee4d2" stroke="none"/><path d="M400 357 L620 357 L620 439.5 L400 439.5Z" fill="#eee4d2" stroke="none"/><line x1="422" y1="170" x2="422" y2="329.5" stroke="#8a9b7c" stroke-width="49.5" stroke-opacity=".14"/><line x1="422" y1="329.5" x2="334" y2="329.5" stroke="#8a9b7c" stroke-width="49.5" stroke-opacity=".14"/><line x1="334" y1="329.5" x2="334" y2="434" stroke="#8a9b7c" stroke-width="49.5" stroke-opacity=".14"/><g data-tea-furniture="F-L14"><rect x="127.75" y="208.5" width="244.75" height="118.25" fill="#d4bd98" stroke="#b5a181" stroke-width=".9" /></g><g data-tea-furniture="F-L01"><rect x="138.75" y="209.6" width="170.5" height="49.5" fill="#e1d8c5" stroke="#b5a181" stroke-width=".9" /></g><g data-tea-furniture="F-L02"><ellipse cx="235" cy="285.5" rx="38.5" ry="22" fill="#d4bd98" stroke="#b5a181"/></g><g data-tea-furniture="F-L03"><rect x="339.5" y="243.15" width="27.5" height="26.4" fill="#e1d8c5" stroke="#b5a181" stroke-width=".9" /></g><g data-tea-furniture="F-L04"><ellipse cx="532" cy="307.5" rx="33" ry="33" f