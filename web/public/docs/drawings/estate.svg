ont-size="12" fill="#889078" >后期翼房 +72建面 / +60净功能</text><text x="650" y="254" font-size="12" fill="#889078" >完整远景 272建面 / 226净功能</text><text x="650" y="277" font-size="12" fill="#889078" >室外另列：内庭30 / 池水36 / 池畔54㎡</text><text x="650" y="329" font-size="13" fill="#6f825d" >● 一期 · 主宅与内庭</text><text x="650" y="351" font-size="11" fill="#909780" >200㎡概念建面含166㎡净功能；原15.54㎡预留室成为</text><text x="650" y="369" font-size="11" fill="#909780" >可逆画室，30㎡内庭另列。</text><text x="650" y="428" font-size="13" fill="#6f825d" >● 二期 · 影音与健身翼</text><text x="650" y="450" font-size="11" fill="#909780" >独立东南翼60㎡净功能，加12㎡构造设备预留，合72㎡新增</text><text x="650" y="468" font-size="11" fill="#909780" >概念建面。</text><text x="650" y="527" font-size="13" fill="#6f825d" >● 三期 · 泳池与池畔</text><text x="650" y="549" font-size="11" fill="#909780" >36㎡水面与54㎡池畔为室外面积；先确认维护、用水、机房和</text><text x="650" y="567" font-size="11" fill="#909780" >四边安全围界。</text><text x="650" y="643" font-size="11" fill="#7f8b70" >EG02步行归家→D01；健身→ED04更衣→ED02→P</text><text x="650" y="661" font-size="11" fill="#7f8b70" >G01池门。湿脚不穿影音座位。泳池自身四边围界与自闭自锁门</text><text x="650" y="679" font-size="11" fill="#7f8b70" >，不能借地界墙替代。</text><text x="70" y="704" font-size="11" fill="#91967f" >实线深色=本期及之前；浅色虚线=后期预留。朝向与实际基地均待确认。</text></svg>